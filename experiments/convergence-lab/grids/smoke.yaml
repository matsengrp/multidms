# Smoke grid — the harness's worked example and "did I break it" check.
# 2 l2reg × 2 replicates = 4 fits, fit in parallel (capped iters).
sweep:
  l2reg: [0.0, 3.0e-4]   # below and at the L2 knee
fixed:
  warmstart: true
  recompute_scale: false   # the fixed-scale convergence fix (#246)
  share_alpha: true
  fusionreg: 0.0
  ge_type: Sigmoid
  maxiter: 25              # block coordinate-descent iters (capped for speed)
  tol: 1.0e-6
  ge_kwargs: {tol: 1.0e-4, maxiter: 20, maxls: 40, jit: true}
  cal_kwargs: {tol: 1.0e-4, maxiter: 20, maxls: 40, jit: true}
replicates: [1, 2]
