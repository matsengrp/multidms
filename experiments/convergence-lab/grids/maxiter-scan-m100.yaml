# maxiter-scan (inner ge/cal maxiter × recompute_scale) — LEVEL m100 (ge=cal=100).
# Aligned with softplus-floor-off.yaml: same fixed fitting block VERBATIM,
# but recompute_scale is now SWEPT [true, false] and the inner ge/cal_kwargs
# maxiter is pinned to 100 (coupled: ge and cal move together). Outer `maxiter`
# (the block cap) stays at 50 — this scan is the INNER optimizer cap only.
# Grid: recompute_scale[2] × fusionreg[4] × reps[2] = 16 fits.
# Companion levels: maxiter-scan-m1.yaml (ge=cal=1), maxiter-scan-m10.yaml
# (ge=cal=10). Combine the three fit_collection.pkl for the full 48-fit study.
sweep:
  fusionreg: [0.0, 4.0e-5, 1.6e-4, 6.4e-4]      # same 4-point axis as #277
  recompute_scale: [true, false]                # SWEPT (was fixed=false)
fixed:
  output_floor: null                           # OFF control — matched in-harness baseline
  share_alpha: true                             # #274 baseline (shared-α) condition
  warmstart: false
  ge_type: Sigmoid
  l2reg: 0.0
  beta0_ridge: 0.0
  scale_fusion_by_n: false
  alpha_init: 6.0
  beta0_init: {Omicron_BA1: 0.0, Delta: 0.0, Omicron_BA2: 0.0}
  beta_clip_range: [-10, 10]
  loss_kwargs: {δ: 1.0}
  maxiter: 50                                   # outer block cap (unchanged)
  tol: 1.0e-5                                   # outer tol
  ge_kwargs: {tol: 1.0e-4, maxiter: 100, maxls: 10, jit: true, verbose: false}
  cal_kwargs: {tol: 1.0e-4, maxiter: 100, maxls: 10, jit: true, verbose: false}
replicates: [1, 2]
