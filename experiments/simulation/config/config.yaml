# Production configuration for the simulation validation pipeline.
# Hyperparameters rescaled for .mean() loss normalization (V0.4.0 anchors).

seed: 2
train_frac: 0.8

simulation:
  genelength: 50
  wt_latent: 5.0
  stop_effect: -10
  norm_weights: [[0.4, -0.33, 0.8], [0.6, -2.666, 2]]
  n_non_identical_sites: 10
  min_muteffect_in_bundle: -1.0
  max_muteffect_in_bundle: 1.0
  n_shifted_non_identical_sites: 6
  n_shifted_identical_sites: 4
  shift_gauss_variance: 0.666
  sigmoid_phenotype_scale: 6
  variants_per_lib_genelength_scalar: 1000
  avgmuts: 2.0
  bclen: 16
  variant_error_rate: 0.0
  avgdepth_per_variant: 200
  lib_uniformity: 5
  noise: 0.0
  bottleneck_variants_per_lib_scalar:
    tight_bottle: 5
    loose_bottle: 100
  output_dir: results
  fitting:
    maxiter: 200
    tol: 1.0e-4
    fusionreg_values: [0.0, 5.0e-6, 1.0e-5, 2.0e-5, 4.0e-5, 8.0e-5, 1.6e-4, 3.2e-4, 6.4e-4]
    l2reg: 1.0e-6
    beta0_ridge: 0.01
    ge_type: "Sigmoid"
    warmstart: false
    beta0_init: {h1: 5.0, h2: 0.0}
    alpha_init: 6.0
    share_alpha: true
    beta_clip_range: [-10, 10]
    loss_kwargs: {"δ": 1.0}
    ge_kwargs: {tol: 1.0e-4, maxiter: 10, maxls: 40, jit: true, verbose: false}
    cal_kwargs: {tol: 1.0e-4, maxiter: 10, maxls: 40, jit: true, verbose: false}
    n_processes: 2  # pinned: auto (null) picks workers by core count alone,
    # ignoring memory, which exhausted a 36 GB host mid-run. Never restore null.
