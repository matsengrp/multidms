# Production configuration for the simulation validation pipeline.
# Hyperparameters rescaled for .mean() loss normalization (V0.4.0 anchors).

seed: 2
train_frac: 0.8

simulation:
  genelength: 50
  wt_latent: 5.0
  stop_effect: -10
  norm_weights: [[0.4, -0.33, 0.8], [0.6, -2.666, 2]]
  n_non_identical_sites: 10
  min_muteffect_in_bundle: -1.0
  max_muteffect_in_bundle: 1.0
  n_shifted_non_identical_sites: 6
  n_shifted_identical_sites: 4
  shift_gauss_variance: 0.666
  sigmoid_phenotype_scale: 6
  variants_per_lib_genelength_scalar: 1000
  avgmuts: 2.0
  bclen: 16
  variant_error_rate: 0.0
  avgdepth_per_variant: 200
  lib_uniformity: 5
  noise: 0.0
  bottleneck_variants_per_lib_scalar:
    tight_bottle: 5
    loose_bottle: 100
  output_dir: results
  fitting:
    maxiter: 200
    tol: 1.0e-4
    fusionreg_values: [0.0, 5.0e-6, 1.0e-5, 2.0e-5, 4.0e-5, 8.0e-5, 1.6e-4, 3.2e-4, 6.4e-4]
    l2reg: 1.0e-6
    beta0_ridge: 0.01
    ge_type: "Sigmoid"
    warmstart: false
    beta0_init: {h1: 5.0, h2: 0.0}
    alpha_init: 6.0
    share_alpha: true
    beta_clip_range: [-10, 10]
    loss_kwargs: {"δ": 1.0}
    # Inner block-solver cap. Raised 10 -> 100 in #291 (Phase 1 of EPIC #290).
    # PR #288 lowered it 100 -> 10 as a side effect of the config tier split;
    # that is the measured cause of the non-monotonic shift-sparsity curve.
    # Single-knob arms at inner=100 on lib_1_observed_phenotype_func_score:
    # sparsity +0.341 at fusionreg=3.2e-4 (0.5189 -> 0.8600) and +0.383 at
    # 6.4e-4 (0.2600 -> 0.6432), with alpha returning from ~9.3 to ~6.2-7.0
    # (alpha_init 6.0) and objective_total down 58%. Zeroing l2reg (+0.000) or
    # beta0_ridge (+0.067) does not reproduce this.
    #
    # Convergence triple for later EPIC #290 phases to inherit --
    # SIMULATION-PIPELINE SCOPE ONLY:
    #     (inner maxiter, outer maxiter, tol) = (100, 200, 1.0e-4)
    # experiments/scv2-spike/ deliberately stays at inner maxiter = 10: the
    # evidence above is simulation-only (noise-free data, known ground-truth
    # sparsity 0.81), the cost on spike is unmeasured, and changing spike's
    # fit-tier config.yaml would invalidate its cached fits. Any spike change
    # must be measured on spike data first.
    ge_kwargs: {tol: 1.0e-4, maxiter: 100, maxls: 40, jit: true, verbose: false}
    cal_kwargs: {tol: 1.0e-4, maxiter: 100, maxls: 40, jit: true, verbose: false}
    # Worker count for the 54-fit grid (6 datasets x 9 fusionreg). NEVER set
    # this to null: auto-selection picks workers by core count alone, ignoring
    # memory, which exhausted a 36 GB host mid-run.
    #
    # This is HOST-DEPENDENT and must be sized to the machine's RAM, not its
    # core count. Each worker rebuilds its own copy of every Data object it
    # fits (see model_collection.py's fit_models docstring), measured at ~42 GB
    # resident per worker on this grid. Budget ~45 GB/worker and keep total
    # under ~50% of host RAM.
    #
    # Raised 6 -> 18 in #291 after measuring the #291 prod run on orca02
    # (64 cores, 1511 GB): at 6 workers it used only 17% of RAM and ~11% of
    # cores, and fit_models alone took 7.9h wall (47.2 CPU-h). 18 workers is
    # ~756 GB (50% of RAM) and divides the 54 fits into exactly 3 waves.
    # Lower this when running on a smaller host.
    n_processes: 18
