# Downstream-tier configuration for the SARS-CoV-2 spike pipeline.
#
# Keys here are read ONLY by evaluate (and future plotting/analysis rules).
# Editing this file must NOT invalidate the cached fit_collection.pkl -- that
# is the whole point of the split. Fit-tier edits (the sibling config) DO
# invalidate the fit.

spike:
  # Chosen lasso weight (manuscript λ). Re-derived for EPIC #290 Phase 2 from
  # results-prod-292-spike-fit-tuning at tol 1e-6 on a stationary objective
  # (recompute_scale: false), over the manuscript ladder plus a 1.28e-3 probe
  # rung that is excluded from analysis (see config.yaml). 18/18 analysed fits
  # converged. The value is unchanged at 8.0e-05, now on stronger evidence.
  #
  #   lambda    stop sparsity   corr shift_Delta   val loss (% over min)
  #   2.0e-05       0.288            0.629              +1.14%
  #   4.0e-05       0.514            0.633              +0.16%
  #   8.0e-05       0.804            0.640               0.00%   <- chosen
  #   1.6e-04       0.956            0.625              +3.63%
  #
  # Under tol 1e-6 all three criteria agree on 8.0e-05 for the first time:
  #
  #   - stop-codon sparsity ("nearly all nonsense shifts are zero"): 8.0e-05 is
  #     the SMALLEST rung clearing 0.75, at 0.804. 4.0e-05 reaches only 0.514.
  #   - validation loss: now MINIMIZED at 8.0e-05. At tol 1e-5 the minimum sat
  #     at 4.0e-05 with 8.0e-05 costing +0.06%; tightening the tolerance moved
  #     the minimum one rung up rather than changing its shape, and the two
  #     rungs remain within 0.16% of each other -- this criterion is nearly
  #     flat across the pair either way, so read the agreement as corroboration,
  #     not as a decisive independent vote.
  #   - replicate correlation of shift_Delta: 0.640, the best of any rung
  #     clearing the sparsity criterion. The global maximum (0.661 at
  #     fusionreg 0) is not a candidate: sparsity there is 0.056, failing the
  #     nonsense criterion outright.
  #
  # The tolerance change moved these numbers by <0.05 everywhere on the
  # analysed ladder (median |delta| 0.001 for sparsity, 0.0006 for
  # correlation), so lambda is robust to the stopping criterion rather than an
  # artifact of where the optimizer stopped.
  #
  # The large shift_Omicron_BA2 correlation once seen at 1.28e-3 (0.836 at tol
  # 1e-5) was never evidence for a larger lambda -- only 31 of 5,809 mutations
  # are non-zero in both replicates there, so it was dominated by shared zeros.
  # At tol 1e-6 that rung does not even converge, and the figure falls to 0.367.
  lasso_choice: 8.0e-05
  condition_colors:
    Delta: '#F97306'
    Omicron_BA1: '#BFBFBF'
    Omicron_BA2: '#9400D3'
  condition_titles:
    Delta: Delta
    Omicron_BA1: BA.1
    Omicron_BA2: BA.2
  domain_dict:
    NTD: [13, 293]
    RBD: [330, 528]
    SD1: [528, 590]
    SD2: [590, 685]
    FP: [815, 834]
    HR1: [907, 985]
    CH: [985, 1035]
    CD: [1075, 1162]
    HR2: [1162, 1211]
    TM: [1211, 1234]

  # ---------------------------------------------------------------------
  # Manuscript figure knobs (read only by manuscript_figures.ipynb).
  #
  # These live in the downstream tier so a figure tweak re-runs off the
  # cached fit instead of triggering a ~2 h 20 min refit. See issue #287
  # and the "Configuration tiers" section of the README.
  # ---------------------------------------------------------------------
  figures:
    # Written as both PDF (what the manuscript build consumes) and PNG
    # (what the docs page shows). Both are declared rule outputs.
    formats: [pdf, png]
    dpi: 300

    # The 1.28e-3 rung is retained in the fit ladder but is unstable --
    # rep_1 diverges after sweep ~100 (see config.yaml). Figures that plot
    # "all rungs" (S9, S16) mark it rather than silently showing it as a
    # normal point. Set to [] to plot every rung unmarked.
    excluded_fusionreg: [1.28e-3]

    # Figure 4 -- shift-by-site heatmap with zoom panels.
    # Regions were originally chosen by eye from v0.4.0 shift values;
    # lambda is unchanged at 8.0e-05, so they should still hold, but the
    # notebook re-checks that each window contains a top-ranked shift and
    # warns if not.
    heatmap:
      site_ranges:
        zoom1: [137, 142]
        zoom2: [416, 421]
        zoom3: [568, 573]
        zoom4: [843, 856]
        zoom5: [1019, 1029]
      cmap: RdBu
      vmin: -2.0
      vmax: 2.0
      missing_color: lightgrey
      scatter_ylim: [-2, 3]
      # Amino-acid row order: charged/polar first, hydrophobic last,
      # gap and stop at the end. Matches the legacy notebook exactly.
      aa_order: [R, K, H, D, E, Q, N, S, T, Y, W, F, A, I, L, M, V, G, P, C, '-', '*']

    # Figure 5 -- validation titer fold-change.
    #
    # The x-axis is NOT beta and NOT shift. It is the predicted enrichment
    # ratio, 2 ** predicted_func_score_{condition}; the legacy variable was
    # misleadingly named `predicted_beta`. A reviewer asked about this
    # explicitly and it is answered in the response-to-reviews.
    validation:
      mutations: [D142L, A419S, A570D, K854N, T1027I]
      # The titer CSVs label backgrounds differently from the pipeline's
      # condition names. Without this map the Figure 5 join silently
      # produces an empty frame.
      background_to_condition:
        Delta: Delta
        BA.1: Omicron_BA1
        BA.2: Omicron_BA2
      xlim: [0.1, 1.3]
      ylim: [1.0e-5, 2.0]

  # ---------------------------------------------------------------------
  # Naive (independent per-condition) baseline arm -- EPIC #290 Phase 4.
  #
  # Downstream tier: the naive arm reads the fit-tier `spike.fitting` knobs
  # via params: (untracked by Snakemake) but declares NO new fit-tier keys,
  # so adding these cannot invalidate fit_collection.pkl. See issue #287.
  # ---------------------------------------------------------------------
  naive:
    # Must match evaluate.ipynb's combine_replicate_muts(..., times_seen_threshold=1).
    # Filtering the two arms differently rigs the headline comparison: joint
    # shift_Delta replicate R^2 reads 0.543 at threshold 3 but 0.410 at 1.
    times_seen_threshold: 1
    # Every condition to fit, INCLUDING the reference -- six fits = this list
    # times two replicates. Shifts are derived for every entry except
    # spike.reference, whose shift is identically zero.
    conditions: [Delta, Omicron_BA1, Omicron_BA2]
