# Downstream-tier configuration for the SARS-CoV-2 spike pipeline.
#
# Keys here are read ONLY by evaluate (and future plotting/analysis rules).
# Editing this file must NOT invalidate the cached fit_collection.pkl -- that
# is the whole point of the split. Fit-tier edits (the sibling config) DO
# invalidate the fit.

spike:
  # Chosen lasso weight (manuscript λ). Moved 4.0e-05 -> 8.0e-05; matches the
  # value the simulation pipeline already uses. Evidence from the current prod
  # run (results-prod-287-config-tier-split), read across the three selection
  # criteria from the manuscript:
  #   - replicate shift correlation: shift_Delta peaks here (0.640 -> 0.650),
  #     and shift_BA2 is still climbing (0.584 -> 0.628).
  #   - stop-codon sparsity: 0.55/0.59 -> 0.81/0.79 for shift_Delta, i.e. much
  #     closer to the "nearly all nonsense shifts are zero" criterion.
  #   - validation loss: minimum is at 4.0e-05 (1.0692) but 8.0e-05 is 1.0718,
  #     a 0.24% penalty -- flat enough that the other two criteria decide.
  # Phase 2 of EPIC #290 re-derives this under tighter convergence and an
  # extended ladder; revisit if the curves move.
  lasso_choice: 8.0e-05
  condition_colors:
    Delta: '#F97306'
    Omicron_BA1: '#BFBFBF'
    Omicron_BA2: '#9400D3'
  condition_titles:
    Delta: Delta
    Omicron_BA1: BA.1
    Omicron_BA2: BA.2
  domain_dict:
    NTD: [13, 293]
    RBD: [330, 528]
    SD1: [528, 590]
    SD2: [590, 685]
    FP: [815, 834]
    HR1: [907, 985]
    CH: [985, 1035]
    CD: [1075, 1162]
    HR2: [1162, 1211]
    TM: [1211, 1234]
