# Downstream-tier configuration for the SARS-CoV-2 spike pipeline.
#
# Keys here are read ONLY by evaluate (and future plotting/analysis rules).
# Editing this file must NOT invalidate the cached fit_collection.pkl -- that
# is the whole point of the split. Fit-tier edits (the sibling config) DO
# invalidate the fit.

spike:
  # Chosen lasso weight (manuscript λ). Re-derived for EPIC #290 Phase 2 from
  # results-prod-292-spike-fit-tuning at tol 1e-6 on a stationary objective
  # (recompute_scale: false), over the manuscript ladder plus a 1.28e-3 probe
  # rung that is excluded from analysis (see config.yaml). 18/18 analysed fits
  # converged. The value is unchanged at 8.0e-05, now on stronger evidence.
  #
  #   lambda    stop sparsity   corr shift_Delta   val loss (% over min)
  #   2.0e-05       0.288            0.629              +1.14%
  #   4.0e-05       0.514            0.633              +0.16%
  #   8.0e-05       0.804            0.640               0.00%   <- chosen
  #   1.6e-04       0.956            0.625              +3.63%
  #
  # Under tol 1e-6 all three criteria agree on 8.0e-05 for the first time:
  #
  #   - stop-codon sparsity ("nearly all nonsense shifts are zero"): 8.0e-05 is
  #     the SMALLEST rung clearing 0.75, at 0.804. 4.0e-05 reaches only 0.514.
  #   - validation loss: now MINIMIZED at 8.0e-05. At tol 1e-5 the minimum sat
  #     at 4.0e-05 with 8.0e-05 costing +0.06%; tightening the tolerance moved
  #     the minimum one rung up rather than changing its shape, and the two
  #     rungs remain within 0.16% of each other -- this criterion is nearly
  #     flat across the pair either way, so read the agreement as corroboration,
  #     not as a decisive independent vote.
  #   - replicate correlation of shift_Delta: 0.640, the best of any rung
  #     clearing the sparsity criterion. The global maximum (0.661 at
  #     fusionreg 0) is not a candidate: sparsity there is 0.056, failing the
  #     nonsense criterion outright.
  #
  # The tolerance change moved these numbers by <0.05 everywhere on the
  # analysed ladder (median |delta| 0.001 for sparsity, 0.0006 for
  # correlation), so lambda is robust to the stopping criterion rather than an
  # artifact of where the optimizer stopped.
  #
  # The large shift_Omicron_BA2 correlation once seen at 1.28e-3 (0.836 at tol
  # 1e-5) was never evidence for a larger lambda -- only 31 of 5,809 mutations
  # are non-zero in both replicates there, so it was dominated by shared zeros.
  # At tol 1e-6 that rung does not even converge, and the figure falls to 0.367.
  lasso_choice: 8.0e-05
  condition_colors:
    Delta: '#F97306'
    Omicron_BA1: '#BFBFBF'
    Omicron_BA2: '#9400D3'
  condition_titles:
    Delta: Delta
    Omicron_BA1: BA.1
    Omicron_BA2: BA.2
  domain_dict:
    NTD: [13, 293]
    RBD: [330, 528]
    SD1: [528, 590]
    SD2: [590, 685]
    FP: [815, 834]
    HR1: [907, 985]
    CH: [985, 1035]
    CD: [1075, 1162]
    HR2: [1162, 1211]
    TM: [1211, 1234]
