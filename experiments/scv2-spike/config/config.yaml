# Production configuration for the SARS-CoV-2 spike analysis pipeline.
# Parameters from the legacy profile_beta0_zero_l2reg_10x profile with
# the expanded fusionreg grid used in the manuscript.

seed: 4
train_frac: 0.8

spike:
  output_dir: results
  reference: "Omicron_BA1"
  experiment_conditions: ["Delta", "Omicron_BA1", "Omicron_BA2"]
  replicate_1_experiments: ["Delta-2", "Omicron_BA1-2", "Omicron_BA2-1"]
  replicate_2_experiments: ["Delta-4", "Omicron_BA1-3", "Omicron_BA2-2"]

  # Data source — raw CSVs from the public legacy repository
  data_url: "https://raw.githubusercontent.com/matsengrp/SARS-CoV-2_spike_multidms/main/data"

  # Filtering thresholds
  pre_count_threshold: 100
  post_count_threshold: 0
  max_subs: 10
  func_score_clip: [-3.5, 2.5]
  pseudocount: 0.5
  do_truncate_nonsense: true
  subsample_frac: null  # null = use all data

  # Fitting parameters — rescaled for .mean() loss normalization (V0.4.0 anchors)
  fitting:
    maxiter: 200
    tol: 1.0e-4
    recompute_scale: true
    fusionreg_values: [0.0, 5.0e-6, 1.0e-5, 2.0e-5, 4.0e-5, 8.0e-5, 1.6e-4, 3.2e-4, 6.4e-4]
    l2reg: 1.0e-6
    beta0_ridge: 0.01
    scale_fusion_by_n: false
    ge_type: "Sigmoid"
    warmstart: false
    beta0_init: {Omicron_BA1: 0.0, Delta: 0.0, Omicron_BA2: 0.0}
    alpha_init: 6.0
    share_alpha: true
    beta_clip_range: [-10, 10]
    loss_kwargs: {"δ": 1.0}
    ge_kwargs: {tol: 1.0e-4, maxiter: 10, maxls: 40, jit: true, verbose: false}
    cal_kwargs: {tol: 1.0e-4, maxiter: 10, maxls: 40, jit: true, verbose: false}
    n_processes: 6  # pinned: auto (null) picks workers by core count alone,
    # ignoring memory, which exhausted a 36 GB host mid-run. Never restore null.
