# Production configuration for the SARS-CoV-2 spike analysis pipeline.
# Parameters from the legacy profile_beta0_zero_l2reg_10x profile with
# the expanded fusionreg grid used in the manuscript.

seed: 4
train_frac: 0.8

spike:
  output_dir: results
  reference: "Omicron_BA1"
  experiment_conditions: ["Delta", "Omicron_BA1", "Omicron_BA2"]
  replicate_1_experiments: ["Delta-2", "Omicron_BA1-2", "Omicron_BA2-1"]
  replicate_2_experiments: ["Delta-4", "Omicron_BA1-3", "Omicron_BA2-2"]

  # Data source — raw CSVs from the public legacy repository
  data_url: "https://raw.githubusercontent.com/matsengrp/SARS-CoV-2_spike_multidms/main/data"

  # Filtering thresholds
  pre_count_threshold: 100
  post_count_threshold: 0
  max_subs: 10
  func_score_clip: [-3.5, 2.5]
  pseudocount: 0.5
  do_truncate_nonsense: true
  subsample_frac: null  # null = use all data

  # Fitting parameters — rescaled for .mean() loss normalization (V0.4.0 anchors)
  fitting:
    # Outer block-coordinate-descent ceiling. 500 is headroom, not a target;
    # a fit that reaches it has NOT converged regardless of any success count.
    maxiter: 500
    # 1e-6, tightened from the 1e-5 that produced 20/20 in the first Stage 1
    # run. The tolerance is a *between-sweep relative change*, not a gradient
    # norm, so the question was whether the inner solvers (tol 1e-4) floor it.
    # They do not: every one of those 20 fits was still decaying geometrically
    # at its stopping point (median tail rate 0.941/sweep), so the tail had not
    # flattened. Extrapolating each fit's own decay rate to 1e-6 projects a
    # median of 127 sweeps and a worst case of 193 — well inside maxiter 500.
    tol: 1.0e-6
    # false => the objective normalizer is computed once after warmstart and
    # held constant, so the proximal lasso threshold `fusionreg / scale` is
    # stationary across sweeps. Under `true` the threshold drifts between
    # sweeps, which makes a lasso-selection study measure a moving target, and
    # pins obj_old to 1.0 so the convergence test never sees a between-sweep
    # change. Matches the simulation pipeline after PR #303.
    recompute_scale: false
    # Extended by one rung (1.28e-3) above the manuscript's 6.4e-4 ceiling, to
    # test whether stop-codon sparsity is still climbing past the top rung.
    # It is not: sparsity saturates at 1.000 by 3.2e-4 and is flat thereafter.
    #
    # The 1.28e-3 rung is RETAINED here but EXCLUDED from analysis (gate G5).
    # Under tol 1e-6 it is the only rung that fails to converge, and the
    # trajectory shows why: rep_1 reaches objective_error 2.7e-06 at sweep 100,
    # then diverges -- the error climbs back to ~1.8e-04 and flattens (tail rate
    # ~1.000), and the objective rises 10% above its sweep-109 minimum. That is
    # instability at this lasso strength, not slow convergence, so raising
    # maxiter would not fix it. The tol 1e-5 run stopped at sweep 94, before the
    # divergence began, and so reported this rung as converged.
    #
    # It stays in the ladder because removing it would invalidate this config
    # and force a full refit purely to *stop* computing one rung, discarding the
    # evidence above. Nothing selects models by ladder position -- evaluate
    # queries `fusionreg == lasso_choice` -- so an excluded rung is inert.
    fusionreg_values: [0.0, 5.0e-6, 1.0e-5, 2.0e-5, 4.0e-5, 8.0e-5, 1.6e-4, 3.2e-4, 6.4e-4, 1.28e-3]
    # Exploratory arm: the settled value is 1.0e-6. Dropped 10x to 1.0e-7 to
    # weaken the beta ridge, paired with the widened clip below. Since the
    # [-10, 10] clip was proven inactive (max|beta| ~2.9), the ridge and the
    # fusion lasso are what actually constrain beta -- so this is the knob that
    # should move the fit. Not a candidate for main.
    l2reg: 1.0e-7
    beta0_ridge: 0.01
    scale_fusion_by_n: false
    ge_type: "Sigmoid"
    warmstart: false
    beta0_init: {Omicron_BA1: 0.0, Delta: 0.0, Omicron_BA2: 0.0}
    alpha_init: 6.0
    share_alpha: true
    # Exploratory arm: settled bound is [-10, 10] (#263), proven inactive at
    # that width. Widened 5x to [-50, 50] so the loosened ridge above has room
    # to push mutation effects out if it wants to.
    beta_clip_range: [-50, 50]
    loss_kwargs: {"δ": 1.0}
    # Inner solver maxiter deliberately stays at 10 while the outer loop moves
    # to tol 1e-5 / maxiter 500. Simulation runs 100, but changing two
    # convergence knobs in one run makes a bad result unattributable, and
    # inner=10 has never been shown to be spike's problem. If fits converge
    # poorly, raising this to 100 is the first lever — on evidence.
    ge_kwargs: {tol: 1.0e-4, maxiter: 10, maxls: 40, jit: true, verbose: false}
    cal_kwargs: {tol: 1.0e-4, maxiter: 10, maxls: 40, jit: true, verbose: false}
    n_processes: 6  # pinned: auto (null) picks workers by core count alone,
    # ignoring memory, which exhausted a 36 GB host mid-run. Never restore null.
