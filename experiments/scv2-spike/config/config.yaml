# Production configuration for the SARS-CoV-2 spike analysis pipeline.
# Parameters from the legacy profile_beta0_zero_l2reg_10x profile with
# the expanded fusionreg grid used in the manuscript.

seed: 4
train_frac: 0.8

spike:
  output_dir: results
  reference: "Omicron_BA1"
  experiment_conditions: ["Delta", "Omicron_BA1", "Omicron_BA2"]
  replicate_1_experiments: ["Delta-2", "Omicron_BA1-2", "Omicron_BA2-1"]
  replicate_2_experiments: ["Delta-4", "Omicron_BA1-3", "Omicron_BA2-2"]

  # Data source — raw CSVs from the public legacy repository
  data_url: "https://raw.githubusercontent.com/matsengrp/SARS-CoV-2_spike_multidms/main/data"

  # Filtering thresholds
  pre_count_threshold: 100
  post_count_threshold: 1
  max_subs: 10
  func_score_clip: [-3.5, 2.5]
  pseudocount: 0.5
  do_truncate_nonsense: true
  subsample_frac: null  # null = use all data

  # Display
  condition_colors:
    Delta: "#F97306"
    Omicron_BA1: "#BFBFBF"
    Omicron_BA2: "#9400D3"
  condition_titles:
    Delta: "Delta"
    Omicron_BA1: "BA.1"
    Omicron_BA2: "BA.2"

  # Fitting parameters (profile_beta0_zero_l2reg_10x)
  fitting:
    maxiter: 75
    tol: 1.0e-6
    fusionreg_values: [0.0, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]
    l2reg: 1.0e-2
    beta0_ridge: 0
    ge_type: "Sigmoid"
    warmstart: false
    beta0_init: {Omicron_BA1: 0.0, Delta: 0.0, Omicron_BA2: 0.0}
    alpha_init: {Omicron_BA1: 6.0, Delta: 6.0, Omicron_BA2: 6.0}
    beta_clip_range: [-10, 10]
    loss_kwargs: {"δ": 1.0}
    ge_kwargs: {tol: 1.0e-5, maxiter: 1000, maxls: 40, jit: true, verbose: false}
    cal_kwargs: {tol: 1.0e-4, maxiter: 1000, maxls: 40, jit: true, verbose: false}
    n_processes: null  # null = auto: min(cpu_count // 2, n_models)
  lasso_choice: 3.2

  # Spike protein domain boundaries (for downstream Phase 4 notebooks)
  domain_dict:
    NTD: [13, 293]
    RBD: [330, 528]
    SD1: [528, 590]
    SD2: [590, 685]
    FP: [815, 834]
    HR1: [907, 985]
    CH: [985, 1035]
    CD: [1075, 1162]
    HR2: [1162, 1211]
    TM: [1211, 1234]
