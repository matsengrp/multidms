# Test configuration for the SARS-CoV-2 spike analysis pipeline.
# Reduced parameters for fast laptop iteration (<10 minutes end-to-end).

seed: 4
train_frac: 0.8

spike:
  output_dir: results_test
  reference: "Omicron_BA1"
  experiment_conditions: ["Delta", "Omicron_BA1", "Omicron_BA2"]
  replicate_1_experiments: ["Delta-2", "Omicron_BA1-2", "Omicron_BA2-1"]
  replicate_2_experiments: ["Delta-4", "Omicron_BA1-3", "Omicron_BA2-2"]

  # Data source — raw CSVs from the public legacy repository
  data_url: "https://raw.githubusercontent.com/matsengrp/SARS-CoV-2_spike_multidms/main/data"

  # Filtering thresholds
  pre_count_threshold: 100
  post_count_threshold: 0
  max_subs: 10
  func_score_clip: [-3.5, 2.5]
  pseudocount: 0.5
  do_truncate_nonsense: true
  subsample_frac: 0.1  # 10% subsample for fast testing

  # Fitting parameters (reduced for test)
  fitting:
    # Strategy: "independent" fits each fusionreg from scratch (parallel);
    # "continuation" fits a warm-started path along ascending fusionreg.
    # "independent" — the strategy the prod profile uses. Was "continuation",
    # which exercises the known-broken partial-collection path (#240) and is
    # deferred by EPIC #290. Note the Snakefile reads this from YAML, so
    # `--config strategy=...` does NOT override it; edit here.
    strategy: "independent"
    maxiter: 2
    tol: 1.0e-4
    # Matches prod so the test exercises the same solver path.
    recompute_scale: false
    fusionreg_values: [0.0, 4.0e-5]
    l2reg: 0.0
    beta0_ridge: 1.0e-4
    scale_fusion_by_n: false
    ge_type: "Sigmoid"
    warmstart: false
    beta0_init: {Omicron_BA1: 0.0, Delta: 0.0, Omicron_BA2: 0.0}
    alpha_init: 6.0
    share_alpha: true
    beta_clip_range: [-10, 10]
    loss_kwargs: {"δ": 1.0}
    ge_kwargs: {tol: 1.0e-4, maxiter: 2, maxls: 40, jit: true, verbose: false}
    cal_kwargs: {tol: 1.0e-4, maxiter: 2, maxls: 40, jit: true, verbose: false}
    n_processes: null  # null = auto: min(cpu_count // 2, n_models)
