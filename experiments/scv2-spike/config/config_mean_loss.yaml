# Spike production config with .mean() loss normalization.
# Hyperparameters rescaled from V2 .sum() values using V0.4.0 anchors.
#
# Scaling rationale (see issue #227):
# - V2 .sum() fusionreg chosen=3.2, V0.4.0 .mean() chosen=4e-5
#   Ratio: 3.2 / 4e-5 = 80,000 ≈ avg variants per condition
# - fusionreg grid: V0.4.0 grid directly
# - l2reg: V0.4.0 used 0.0 (spike), 1e-7 (sim). Grid around 1e-7.
# - beta0_ridge: V2 used 10; scaled by ~93K → ~1e-4.
#   V0.4.0 had no analogue. Grid: [0.0, 1e-5, 1e-4]

seed: 4
train_frac: 0.8

spike:
  output_dir: results-mean-loss
  reference: "Omicron_BA1"
  experiment_conditions: ["Delta", "Omicron_BA1", "Omicron_BA2"]
  replicate_1_experiments: ["Delta-2", "Omicron_BA1-2", "Omicron_BA2-1"]
  replicate_2_experiments: ["Delta-4", "Omicron_BA1-3", "Omicron_BA2-2"]

  # Data source — raw CSVs from the public legacy repository
  data_url: "https://raw.githubusercontent.com/matsengrp/SARS-CoV-2_spike_multidms/main/data"

  # Filtering thresholds (same as production)
  pre_count_threshold: 100
  post_count_threshold: 0
  max_subs: 10
  func_score_clip: [-3.5, 2.5]
  pseudocount: 0.5
  do_truncate_nonsense: true
  subsample_frac: null  # null = use all data

  # Display
  condition_colors:
    Delta: "#F97306"
    Omicron_BA1: "#BFBFBF"
    Omicron_BA2: "#9400D3"
  condition_titles:
    Delta: "Delta"
    Omicron_BA1: "BA.1"
    Omicron_BA2: "BA.2"

  # Fitting parameters — rescaled for .mean() loss normalization
  fitting:
    maxiter: 50
    tol: 1.0e-4
    fusionreg_values: [0.0, 5.0e-6, 1.0e-5, 2.0e-5, 4.0e-5, 8.0e-5, 1.6e-4, 3.2e-4, 6.4e-4]
    l2reg: 0.0
    beta0_ridge: 1.0e-4
    scale_fusion_by_n: false
    ge_type: "Sigmoid"
    warmstart: false
    beta0_init: {Omicron_BA1: 0.0, Delta: 0.0, Omicron_BA2: 0.0}
    alpha_init: 6.0
    share_alpha: true
    beta_clip_range: [-10, 10]
    loss_kwargs: {"δ": 1.0}
    ge_kwargs: {tol: 1.0e-4, maxiter: 50, maxls: 40, jit: true, verbose: false}
    cal_kwargs: {tol: 1.0e-4, maxiter: 50, maxls: 40, jit: true, verbose: false}
    n_processes: null  # null = auto: min(cpu_count // 2, n_models)
  lasso_choice: 4.0e-5  # V0.4.0 chosen value

  # Skip cross-validation for initial run
  skip_cross_validation: true

  # Spike protein domain boundaries (for downstream Phase 4 notebooks)
  domain_dict:
    NTD: [13, 293]
    RBD: [330, 528]
    SD1: [528, 590]
    SD2: [590, 685]
    FP: [815, 834]
    HR1: [907, 985]
    CH: [985, 1035]
    CD: [1075, 1162]
    HR2: [1162, 1211]
    TM: [1211, 1234]
