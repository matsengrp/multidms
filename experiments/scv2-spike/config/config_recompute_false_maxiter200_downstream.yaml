# Downstream-tier configuration for the SARS-CoV-2 spike pipeline.
#
# Keys here are read ONLY by evaluate (and future plotting/analysis rules).
# Editing this file must NOT invalidate the cached fit_collection.pkl -- that
# is the whole point of the split. Fit-tier edits (the sibling config) DO
# invalidate the fit.

spike:
  # Chosen lasso weight (manuscript λ); see config_downstream.yaml for the
  # evidence behind the 4.0e-05 -> 8.0e-05 move.
  lasso_choice: 8.0e-05
  condition_colors:
    Delta: '#F97306'
    Omicron_BA1: '#BFBFBF'
    Omicron_BA2: '#9400D3'
  condition_titles:
    Delta: Delta
    Omicron_BA1: BA.1
    Omicron_BA2: BA.2
  domain_dict:
    NTD: [13, 293]
    RBD: [330, 528]
    SD1: [528, 590]
    SD2: [590, 685]
    FP: [815, 834]
    HR1: [907, 985]
    CH: [985, 1035]
    CD: [1075, 1162]
    HR2: [1162, 1211]
    TM: [1211, 1234]

  # Naive (independent per-condition) baseline arm -- EPIC #290 Phase 4.
  # Downstream tier; see config_downstream.yaml for the rationale.
  naive:
    # Must match evaluate.ipynb's times_seen_threshold=1 -- filtering the
    # joint and naive arms differently rigs the headline comparison.
    times_seen_threshold: 1
    conditions: [Delta, Omicron_BA1, Omicron_BA2]
