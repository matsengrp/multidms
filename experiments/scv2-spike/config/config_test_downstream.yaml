# Downstream-tier configuration for the SARS-CoV-2 spike pipeline.
#
# Keys here are read ONLY by evaluate (and future plotting/analysis rules).
# Editing this file must NOT invalidate the cached fit_collection.pkl -- that
# is the whole point of the split. Fit-tier edits (the sibling config) DO
# invalidate the fit.

spike:
  # Chosen lasso weight. MUST be a member of this profile's own
  # `fusionreg_values` ladder in config_test.yaml -- evaluate selects models
  # with `query(f"fusionreg == {lasso_choice}")`, and a value off the ladder
  # matches nothing, so `combine_replicate_muts` fails on an empty fit dict.
  # Commit 320c794 moved every profile's lasso_choice 4.0e-05 -> 8.0e-05, but
  # the test ladder is only [0.0, 4.0e-5], which broke this profile. The prod
  # λ lives in config_downstream.yaml; this one just has to be on the ladder.
  lasso_choice: 4.0e-05
  condition_colors:
    Delta: '#F97306'
    Omicron_BA1: '#BFBFBF'
    Omicron_BA2: '#9400D3'
  condition_titles:
    Delta: Delta
    Omicron_BA1: BA.1
    Omicron_BA2: BA.2
  domain_dict:
    NTD: [13, 293]
    RBD: [330, 528]
    SD1: [528, 590]
    SD2: [590, 685]
    FP: [815, 834]
    HR1: [907, 985]
    CH: [985, 1035]
    CD: [1075, 1162]
    HR2: [1162, 1211]
    TM: [1211, 1234]

  # Manuscript figure knobs. Mirrors config_downstream.yaml so the test
  # profile exercises rule manuscript_figures end-to-end. See that file for
  # the commentary on each key.
  #
  # Two deliberate differences from prod:
  #   - `excluded_fusionreg: []` -- this profile's ladder is [0.0, 4.0e-5],
  #     so the prod exclusion would be a silent no-op. Empty exercises the
  #     unfiltered code path instead.
  #   - The zoom windows are unchanged, but the test fit uses a small variant
  #     subset, so some windows may hold no observed mutation. The notebook
  #     renders those panels empty rather than failing -- a thin ladder is a
  #     property of this profile, not a defect.
  figures:
    formats: [pdf, png]
    dpi: 150
    excluded_fusionreg: []
    heatmap:
      site_ranges:
        zoom1: [137, 142]
        zoom2: [416, 421]
        zoom3: [568, 573]
        zoom4: [843, 856]
        zoom5: [1019, 1029]
      cmap: RdBu
      vmin: -2.0
      vmax: 2.0
      missing_color: lightgrey
      scatter_ylim: [-2, 3]
      aa_order: [R, K, H, D, E, Q, N, S, T, Y, W, F, A, I, L, M, V, G, P, C, '-', '*']
    validation:
      mutations: [D142L, A419S, A570D, K854N, T1027I]
      background_to_condition:
        Delta: Delta
        BA.1: Omicron_BA1
        BA.2: Omicron_BA2
      xlim: [0.1, 1.3]
      ylim: [1.0e-5, 2.0]

  # Naive (independent per-condition) baseline arm -- EPIC #290 Phase 4.
  # Downstream tier; see config_downstream.yaml for the rationale.
  naive:
    # Must match evaluate.ipynb's times_seen_threshold=1 -- filtering the
    # joint and naive arms differently rigs the headline comparison.
    times_seen_threshold: 1
    conditions: [Delta, Omicron_BA1, Omicron_BA2]
