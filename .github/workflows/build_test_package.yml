name: Build and Test

on:
  release:
    types:
      - published
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]' ) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.10 dropped to keep CI fast: 3.9 is the declared floor
        # (requires-python >=3.9, used by the publish job) and 3.11 the newest
        # tested, so the supported boundaries are covered.
        python-version: [3.9, 3.11]

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Ruff Linting
        uses: chartboost/ruff-action@v1
        with:
          version: 0.0.289

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install multidms
        run: |
            pip install --upgrade pip
            pip install -e ".[dev]"
      
      - name: Black Format Check
        uses: psf/black@24.10.0
        with:
          options: "--check"
          src: "."
          jupyter: false
          version: "~= 23.3.0" # this is the version that ships with the vs code extension, currently

      # On pull requests, run only the fast tests + doctests (the default
      # marker filter from pyproject deselects the JAX model-fitting suites,
      # which dominate wall time). On push-to-main and release, re-include the
      # slow tests so nothing merges to main or ships without full coverage.
      #
      # Note the full run excludes `needs_local_data` rather than clearing the
      # filter with `-m ""`: those tests read gitignored pipeline outputs that
      # no runner has, so clearing the filter fails CI by design.
      - name: Test (fast — pull requests)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          pytest --doctest-modules multidms tests

      - name: Test (full — push / release)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          pytest --doctest-modules multidms tests -m "not needs_local_data"
