# pyproject.toml

# Metadata
[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multidms"
version = "1.3.0"
description = "Joint modeling of multiple deep mutational scanning experiments."
readme = "README.md"
authors = [
    { name = "Jared Galloway", email = "jgallowa@fredhutch.org" },
    { name = "Hugh Haddox", email = "hkhaddox@gmail.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
keywords = [
    "multidms",
    "generalized lasso",
    "deep",
    "mutational",
    "scanning",
    "dms",
    "bloom",
    "matsen",
]


# Software Dependencies
requires-python = ">=3.9"
dependencies = [
    "polyclonal",
    "jax>=0.4.29",
    "jaxopt",
    "typing_extensions",
    "numpy",
    "pandas>=2.2.0",
    "binarymap>=0.7",
    "altair==5.1.2",     # pandas convert_dtypes bug
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "tqdm",
    "equinox",
    "pylops",
    "pyproximal",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-pep8",
    "ruff",
    "black~=23.3.0",
    "notebook",
    "snakemake>=7.32.4,<10",
    "papermill>=2.6.0,<3",
    # "sphinx",
    "sphinx==6.2.1",
    "sphinx-autoapi==3.0.0",
    "nbsphinx",
    "nbsphinx-link",
    "bumpver",
    "sphinxcontrib-bibtex",
    "dms_variants",
    "ipywidgets",
    "ghp-import",
]

[tool.ruff]
pydocstyle.convention = "google"
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "UP", # pyupgrade
    "D",  # pydocstyle
]
line-length = 89
extend-exclude = [
    "build",
    "dist",
    "docs/*",
    "notebooks/.*",
    "notebooks",
    "optimization_benchmarks",
    ".*",
]
ignore = [
    "D203",
    "D205",
    "D212",
    "D213",
    "D400",
    "D415",
    "D416",
    "D401",
    "F722",
]

# Poetry
[tool.poetry]
readme = "README.rst"

[project.urls]
# documentation = "https://matsengrp.github.io/multidms/"
repository = "https://github.com/matsengrp/multidms"

[tool.setuptools]
packages = ["multidms"]

[tool.pytest.ini_options]
# Exclude deprecated/backup modules from test collection
testpaths = ["tests", "multidms"]
python_files = ["test_*.py", "*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.bumpver]
current_version = "1.3.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']
"multidms/__init__.py" = ["{version}"]
"docs/conf.py" = ['release = "{version}"']

# ---------------------------------------------------------------------------
# pixi – local development environment manager (https://pixi.sh)
# ---------------------------------------------------------------------------
# pixi reads [project.dependencies] and [project.optional-dependencies]
# from above; no need to duplicate them.

[tool.pixi.workspace]
channels = ["conda-forge"]       # only used for Python itself
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.pypi-dependencies]
multidms = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.environments]
default = { features = ["py311", "dev"], solve-group = "py311" }
py39  = { features = ["py39", "dev"],  solve-group = "py39" }
py310 = { features = ["py310", "dev"], solve-group = "py310" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tool.pixi.feature.py39.dependencies]
python = "3.9.*"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.tasks]
test      = "pytest --doctest-modules multidms tests"
lint      = "ruff check ."
fmt       = "black ."
fmt-check = "black --check ."
docs        = "make -C docs clean && make -C docs html"
docs-deploy = "make -C docs clean && make -C docs html && ghp-import -n -p -f docs/_build/html"

# Simulation pipeline
sim-test  = "snakemake -s experiments/simulation/Snakefile --config profile=test -j4"
sim-prod  = "snakemake -s experiments/simulation/Snakefile -j4"

# Spike pipeline
spike-test = "snakemake -s experiments/scv2-spike/Snakefile --config profile=test -j4"
spike-prod = "snakemake -s experiments/scv2-spike/Snakefile -j4"

# Remote execution
remote-sync     = "bash experiments/scripts/remote-sync.sh"
remote-pipeline = "bash experiments/scripts/remote-pipeline.sh"
remote-status   = "bash experiments/scripts/remote-status.sh"
run-pull        = "bash experiments/scripts/run-pull.sh"

[tool.pixi.dependencies]
pandoc = ">=3.9.0.2,<4"
